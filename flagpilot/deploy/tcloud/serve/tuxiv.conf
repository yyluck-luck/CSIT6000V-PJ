# 课程 qwen-public-serve 的副本
# （/mnt/home/public/course-envs/CSIT6000V/project/student-release/qwen-public-serve）。
# 唯一改动：time 02:00:00 → 01:00:00。tacc 分区 MaxTime=01:00:00（2026-11-16 用 scontrol 核对），
# 申请超过分区上限的作业起不来。服务参数固定：qwen3.8-27b、32K 上下文、4 并发、prefix cache 开。
entrypoint:
  - /usr/bin/python3 ${TACC_WORKDIR}/main.py
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: qwen-public-serve
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=8
    - gres=gpu:2
    - time=01:00:00
    - output=${TACC_SLURM_USERLOG}/qwen-public-serve-%j.log
