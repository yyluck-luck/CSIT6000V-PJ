# FlagPilot 评测客户端：CPU 作业，不申请 GPU，调用同期运行的课程模型服务（serve/）。
# 引导方式与课程 qwen-public-client 相同：SDK 激活课程管理环境 mpi-gemm-v1 →
# job.sh 再激活课程项目环境 → 用课程 Python 3.12（PRoot）跑 FlagPilot。
# 时长不能超过分区上限 1 小时，而且服务作业必须比客户端活得久。
entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: flagpilot-client
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=4
    - time=00:45:00
    - output=${TACC_SLURM_USERLOG}/flagpilot-client-%j.log
